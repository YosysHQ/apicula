name: Tiled fuzzer

# Places random primitive configurations with the vendor tools and with
# Apicula and compares the bitstreams (tools/tiled_fuzzer.py). Failures listed
# in tools/fuzz_known.json are known and reported as broken; any other failure
# fails the run. A fixed seed, PYTHONHASHSEED and pinned tools make the run
# reproducible, so its results can be compared with the list.
#
# To update the list after a fix or a new known issue, download the run's
# fuzz-<device> artifact and run:
#   python3 tools/fuzz_report.py -d <device> --write-known tools/fuzz_known.json fuzz-out

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  APICULA_IMAGE: pepijndevos/apicula:1.9.10.03
  FUZZ_TOOLS: hypothesis==6.170.15 yowasp-yosys==0.71.0.0.post1285 yowasp-nextpnr-himbaechel-gowin==0.11.1.0.post826

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        device: [GW1N-9C, GW2A-18C, GW5A-25A]
    steps:
    - uses: actions/checkout@v7
    - name: Build the chipdb and run the fuzzer
      run: |
        docker pull ${{ env.APICULA_IMAGE }}
        docker run -v $(pwd):/usr/src/apicula -w /usr/src/apicula \
          -e GOWINHOME=/usr/src/gowin -e PYTHONHASHSEED=0 ${{ env.APICULA_IMAGE }} bash -c "
            make apycula/${{ matrix.device }}.msgpack.xz &&
            pip install -q ${{ env.FUZZ_TOOLS }} &&
            python3 -u tools/tiled_fuzzer.py -d ${{ matrix.device }} -n 2 --seed 7 -j $(nproc) \
              -o fuzz-out --known tools/fuzz_known.json"
    - name: Upload the reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-${{ matrix.device }}
        path: |
          fuzz-out/**/*.json
          fuzz-out/**/tools.log
          fuzz-out/**/top.log
