name: Build toolchain and examples

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      yosys:
        required: true
        type: string
      nextpnr:
        required: true
        type: string

jobs:
  # The tools are built, and run, in the apicula image, so that the fuzz job
  # can use them next to the IDE.
  build-tools:
    runs-on: ubuntu-latest
    container: pepijndevos/apicula:1.9.10.03
    steps:
    - uses: actions/checkout@v7
    - name: Install build deps
      run: |
        apt-get update
        apt-get install -y build-essential clang bison flex cmake ccache \
          libreadline-dev gawk tcl-dev libffi-dev git libfl-dev \
          graphviz xdot pkg-config libboost-system-dev \
          libboost-python-dev libboost-filesystem-dev zlib1g-dev \
          libboost-thread-dev libboost-program-options-dev libboost-iostreams-dev libboost-dev \
          libeigen3-dev
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ${{ inputs.name }}
        max-size: 1G
    - name: Download python package
      uses: actions/download-artifact@v8
      with:
        name: python-dist
        path: dist
    - name: Install apycula
      run: pip install dist/*.whl
    - name: Get yosys
      run: |
        git clone https://github.com/YosysHQ/yosys.git
        cd yosys
        git checkout ${{ inputs.yosys }}
        git config user.email "ci@localhost"
        git config user.name "CI"
        #git fetch origin pull/5717/head:zaun-latch
        #git merge --no-edit zaun-latch
        git submodule update --init --recursive
    - name: Build yosys    
      run: |
        cd yosys
        cmake -B build . -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build build --config Release --parallel $(nproc)
        cmake --install build --prefix $GITHUB_WORKSPACE/staging/usr/local --strip
    - name: Build nextpnr
      run: |
        git clone https://github.com/YosysHQ/nextpnr.git
        cd nextpnr
        git checkout ${{ inputs.nextpnr }}
        git config user.email "ci@localhost"
        git config user.name "CI"
        #git fetch origin pull/1652/head:zaun-latch
        #git merge --no-edit zaun-latch
        git submodule update --init --recursive
        cmake -B build -DBUILD_PYTHON=OFF -DARCH="himbaechel" \
          -DHIMBAECHEL_UARCH=gowin -DHIMBAECHEL_GOWIN_DEVICES="all" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        make -C build -j$(nproc)
        make -C build install DESTDIR=$GITHUB_WORKSPACE/staging
    - name: Package tools
      run: tar czf tools.tar.gz -C staging/usr/local .
    - name: Upload tools
      uses: actions/upload-artifact@v7
      with:
        name: tools-${{ inputs.name }}
        path: tools.tar.gz

  example:
    runs-on: ubuntu-latest
    container: pepijndevos/apicula:1.9.10.03
    needs: [build-tools]
    strategy:
      fail-fast: false
      matrix:
        board:
          - {target: tangnano20k, dir: examples}
          - {target: primer20k, dir: examples}
          - {target: tangnano, dir: examples, pure: true}
          - {target: tangnano1k, dir: examples}
          - {target: tangnano4k, dir: examples}
          - {target: tangnano9k, dir: examples}
          - {target: szfpga, dir: examples}
          - {target: tec0117, dir: examples}
          - {target: runber, dir: examples}
          - {target: primer25k, dir: examples/gw5a}
          - {target: tangmega138k, dir: examples/gw5a}
          - {target: tangconsole60k, dir: examples/gw5a}
    steps:
    - uses: actions/checkout@v7
    - name: Download tools
      uses: actions/download-artifact@v8
      with:
        name: tools-${{ inputs.name }}
    - name: Install runtime deps
      run: |
        apt-get update
        apt-get install -y libboost-filesystem1.83.0 libboost-program-options1.83.0 \
          libboost-iostreams1.83.0 libboost-thread1.83.0 libboost-system1.83.0
    - name: Install tools
      run: tar xzf tools.tar.gz -C /usr/local && ldconfig
    - name: Download python package
      uses: actions/download-artifact@v8
      with:
        name: python-dist
        path: dist
    - name: Install apycula
      run: |
        if [ "${{ matrix.board.pure }}" = "true" ]; then
          pip uninstall -y numpy fastcrc msgspec  # preinstalled in the image
          pip install --no-deps dist/*.whl
          pip install msgpack cattrs
        else
          pip install dist/*.whl
        fi
    - name: Build examples
      run: make -C ${{ matrix.board.dir }} -j$(nproc) ${{ matrix.board.target }}
    - name: Archive artifact
      uses: actions/upload-artifact@v7
      with:
        name: examples-${{ inputs.name }}-${{ matrix.board.target }}
        path: ${{ matrix.board.dir }}/*.fs
    - name: Sanity check
      if: matrix.board.dir == 'examples'
      run: |
        make -C examples -j$(nproc) ${{ matrix.board.target }}-unpacked
        cd examples
        for f in *-unpacked.v; do
          yosys -p "read_verilog $f; read_verilog -lib +/gowin/cells_sim.v; clean -purge; select -assert-any t:DFF*; select -assert-any t:*BUF;";
        done

  # Places random primitive configurations with the vendor tools and with
  # Apicula and compares the bitstreams: tests/test_fuzz.py, one test per
  # primitive. Known broken primitives are marked there and logged as xfail;
  # any other failure fails the run. The image has the IDE in $GOWINHOME.
  fuzz:
    if: inputs.name == 'dev'
    runs-on: ubuntu-latest
    container: pepijndevos/apicula:1.9.10.03
    needs: [build-tools]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        device: [GW1N-9C, GW2A-18C, GW5A-25A]
    steps:
    - uses: actions/checkout@v7
    - name: Download tools
      uses: actions/download-artifact@v8
      with:
        name: tools-${{ inputs.name }}
    - name: Install runtime deps
      run: |
        apt-get update
        apt-get install -y libboost-filesystem1.83.0 libboost-program-options1.83.0 \
          libboost-iostreams1.83.0 libboost-thread1.83.0 libboost-system1.83.0
    - name: Install tools
      run: |
        tar xzf tools.tar.gz -C /usr/local && ldconfig
        yosys --version
        nextpnr-himbaechel --version
    - name: Download python package
      uses: actions/download-artifact@v8
      with:
        name: python-dist
        path: dist
    - name: Install the chipdb
      # The fuzzer imports this checkout's apycula, so put the wheel's chipdb there.
      run: |
        python3 -m zipfile -e dist/*.whl wheel
        cp wheel/apycula/${{ matrix.device }}.msgpack.xz apycula/
    - name: Run the fuzzer
      env:
        YOSYS: /usr/local/bin/yosys
        NEXTPNR: /usr/local/bin/nextpnr-himbaechel
      run: |
        pip install pytest hypothesis==6.170.15
        python3 -m pytest tests/test_fuzz.py --device ${{ matrix.device }} --fuzz-jobs $(nproc) -rxX
    - name: Upload the reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-${{ matrix.device }}
        path: |
          fuzz-out/**/*.json
          fuzz-out/**/tools.log
          fuzz-out/**/top.log

  hil:
    runs-on: [self-hosted, fpga]
    needs: [example]
    environment: Hardware in the loop
    strategy:
      fail-fast: false
      matrix:
        board: [tangnano9k, tangnano20k]
    steps:
    - uses: actions/checkout@v7
    - name: Download bitstreams
      uses: actions/download-artifact@v8
      with:
        name: examples-${{ inputs.name }}-${{ matrix.board }}
        path: examples
    - name: Run HIL tests
      run: make -k -C examples hil-${{ matrix.board }}
